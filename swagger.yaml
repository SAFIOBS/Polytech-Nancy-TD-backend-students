openapi: 3.0.3
info:
    title: Todo App API - Polytech Nancy TD1
    description: API REST minimale pour la gestion d'une Todo List
    version: 1.0.0
servers:
    - url: http://localhost:8080
      description: Serveur local

paths:
    /tasks:
        get:
            summary: Récupérer l'ensemble des tâches
            description: Retourne la liste des tâches, avec filtrage possible sur le statut.
            parameters:
                - name: todo-only
                  in: query
                  description: Si vrai, retourne uniquement les tâches à réaliser (done = false)
                  required: false
                  schema:
                      type: boolean
                      default: false
            responses:
                '200':
                    description: Liste des tâches récupérée avec succès
                    content:
                        application/json:
                            schema:
                                type: array
                                items:
                                    $ref: '#/components/schemas/Task'
                '204':
                    description: Aucune tâche trouvée (Pas de contenu)

        post:
            summary: Créer une nouvelle tâche
            description: Ajoute une tâche à la liste en mémoire.
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '201':
                    description: Tâche créée avec succès
                    headers:
                        Location:
                            description: URL de la tâche créée
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'

    /tasks/{id}:
        get:
            summary: Récupérer une tâche par son ID
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant unique de la tâche
                  schema:
                      type: integer
            responses:
                '200':
                    description: Tâche trouvée
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Task'
                '404':
                    description: Tâche introuvable

        put:
            summary: Modifier une tâche existante
            description: Modifie l'intégralité d'une tâche à partir de son ID.
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant unique de la tâche à modifier
                  schema:
                      type: integer
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/Task'
            responses:
                '204':
                    description: Tâche modifiée avec succès (aucun contenu renvoyé)
                '404':
                    description: Tâche introuvable

        delete:
            summary: Supprimer une tâche par son ID
            parameters:
                - name: id
                  in: path
                  required: true
                  description: Identifiant unique de la tâche à supprimer
                  schema:
                      type: integer
            responses:
                '204':
                    description: Tâche supprimée avec succès (aucun contenu renvoyé)
                '404':
                    description: Tâche introuvable

components:
    schemas:
        Task:
            type: object
            required:
                - title
                - description
            properties:
                id:
                    type: integer
                    example: 1
                title:
                    type: string
                    example: "Réviser DS de maths"
                description:
                    type: string
                    example: "Séries numériques et probabilités."
                done:
                    type: boolean
                    example: false